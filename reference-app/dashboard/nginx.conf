server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serves index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api-gateway/* → api-gateway K8s service
    location ~ ^/api-gateway/(.*) {
        proxy_pass http://api-gateway:8080/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Proxy /catalog/* → catalog K8s service
    location ~ ^/catalog/(.*) {
        proxy_pass http://catalog:8081/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Proxy /worker/* → worker K8s service
    location ~ ^/worker/(.*) {
        proxy_pass http://worker:8082/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Proxy /api/* → api-gateway (for general API calls)
    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check endpoint for K8s probes
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
