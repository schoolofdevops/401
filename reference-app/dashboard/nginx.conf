server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver — required for runtime hostname resolution
    # when proxy_pass uses variables (regex captures). Without this, nginx resolves
    # upstream hostnames only at startup and fails when containers aren't ready yet.
    resolver 127.0.0.11 valid=10s;

    # SPA fallback — serves index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api-gateway/* → api-gateway service
    location ~ ^/api-gateway/(.*) {
        set $upstream_host api-gateway:8080;
        proxy_pass http://$upstream_host/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Proxy /catalog/* → catalog service
    location ~ ^/catalog/(.*) {
        set $upstream_host catalog:8081;
        proxy_pass http://$upstream_host/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Proxy /worker/* → worker service
    location ~ ^/worker/(.*) {
        set $upstream_host worker:8082;
        proxy_pass http://$upstream_host/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Proxy /api/* → api-gateway (for general API calls)
    location /api/ {
        set $upstream_host api-gateway:8080;
        proxy_pass http://$upstream_host/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check endpoint for container probes
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
