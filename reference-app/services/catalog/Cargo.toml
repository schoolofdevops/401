[package]
name = "catalog"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "catalog"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
shared = { path = "../shared" }
tower-http = { version = "0.6", features = ["cors"] }
