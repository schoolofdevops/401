apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reference-app.fullname" . }}-api-gateway
  labels:
    {{- include "reference-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "reference-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        {{- include "reference-app.labels" . | nindent 8 }}
        app.kubernetes.io/component: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag }}"
          imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CATALOG_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "reference-app.fullname" . }}-config
                  key: CATALOG_URL
            - name: WORKER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "reference-app.fullname" . }}-config
                  key: WORKER_URL
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 2
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
