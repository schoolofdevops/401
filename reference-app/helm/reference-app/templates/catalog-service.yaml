apiVersion: v1
kind: Service
metadata:
  name: {{ include "reference-app.fullname" . }}-catalog
  labels:
    {{- include "reference-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog
spec:
  type: {{ .Values.catalog.service.type }}
  ports:
    - port: {{ .Values.catalog.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "reference-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: catalog
