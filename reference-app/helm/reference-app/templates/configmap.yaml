apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reference-app.fullname" . }}-config
  labels:
    {{- include "reference-app.labels" . | nindent 4 }}
data:
  # Service discovery URLs for api-gateway to reach downstream services
  # Uses K8s service names as hostnames (DNS within the cluster)
  CATALOG_URL: "http://{{ include "reference-app.fullname" . }}-catalog:{{ .Values.catalog.service.port }}"
  WORKER_URL: "http://{{ include "reference-app.fullname" . }}-worker:{{ .Values.worker.service.port }}"
