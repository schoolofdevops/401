apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reference-app.fullname" . }}-db
  labels:
    {{- include "reference-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Full DATABASE_URL for SQLx connection
  database-url: "postgresql://{{ .Values.global.postgresql.username }}:{{ .Values.global.postgresql.password }}@{{ .Values.global.postgresql.host }}:{{ .Values.global.postgresql.port }}/{{ .Values.global.postgresql.database }}"
  # Individual fields for initContainer psql access
  password: {{ .Values.global.postgresql.password | quote }}
