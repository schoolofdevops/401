apiVersion: v1
kind: Service
metadata:
  name: {{ include "reference-app.fullname" . }}-dashboard
  labels:
    {{- include "reference-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.dashboard.service.type "NodePort" }}
      nodePort: {{ .Values.dashboard.service.nodePort }}
      {{- end }}
  selector:
    {{- include "reference-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
