# Fleet Coordinator Agent
# Role: Cross-domain incident triage and specialist delegation
# Install:
#   hermes profile create fleet
#   cp agents/fleet-coordinator/config.yaml ~/.hermes/profiles/fleet/
#   cp agents/fleet-coordinator/SOUL.md ~/.hermes/profiles/fleet/
# Launch:  hermes -p fleet chat
# Note: This agent has no skills/ directory. Its capability is delegation.
# Specialists (track-a, track-b, track-c) must be installed as separate profiles.

model:
  default: "gemini-2.5-flash"
  provider: "openai"
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai"

# Platform config — required for gateway webhook + Telegram delivery
# Set TELEGRAM_BOT_TOKEN in ~/.hermes/profiles/fleet/.env (do NOT hardcode here)
# Then copy fleet profile config: cp agents/fleet-coordinator/config.yaml ~/.hermes/profiles/fleet/
# And add to ~/.hermes/profiles/fleet/config.yaml:
#   platforms:
#     webhook:
#       enabled: true
#       extra: {host: "0.0.0.0", port: 8644}
#     telegram:
#       enabled: true
#       extra: {token: "${TELEGRAM_BOT_TOKEN}"}

platform_toolsets:
  # Morgan needs `terminal` in her toolset because Hermes delegation intersects child toolsets
  # with the parent's enabled_toolsets (see hermes-agent/tools/delegate_tool.py lines 178-184).
  # Specialists Morgan delegates to (Track A/B/C) can only use tools Morgan has in her toolset.
  # Behavioral prohibition against Morgan calling terminal directly is enforced by the NEW
  # "NEVER call terminal tools directly" rule in SOUL.md + the existing 3 domain NEVER rules.
  # Belt (config) + suspenders (SOUL.md) = Morgan can delegate kubectl apply to Track C at L4
  # governance without herself executing any domain commands.
  cli: [terminal, web, skills]

delegation:
  max_iterations: 30
  default_toolsets: ["terminal", "file", "web", "skills"]

approvals:
  mode: manual
  timeout: 300

agent:
  max_turns: 30
  verbose: false
