# Track C: Kubernetes Health & Self-Healing Agent
# Governance Level: L2 Advisory
# Install:
#   hermes profile create track-c
#   cp agents/track-c-kubernetes/config.yaml ~/.hermes/profiles/track-c/
#   cp agents/track-c-kubernetes/SOUL.md ~/.hermes/profiles/track-c/
#   cp -r agents/track-c-kubernetes/skills/sre-k8s-pod-health ~/.hermes/profiles/track-c/skills/
# Launch:  hermes -p track-c chat
# Prerequisite: KIND cluster running (see course/setup/setup-kind.md)

model:
  default: "anthropic/claude-haiku-4"
  provider: "auto"

platform_toolsets:
  cli: [terminal, file, web, skills]

approvals:
  mode: manual       # L2: all flagged dangerous commands require human approval
  timeout: 300       # 5 min — required for lab flows

# Track C safety note: kubectl delete, kubectl drain, kubectl cordon are not in
# Hermes DANGEROUS_PATTERNS. SOUL.md NEVER rules enforce the behavioral boundary.
command_allowlist: []  # L2: nothing pre-approved (Hermes-native bypass mechanism; unchanged)

# ── Course-local wrapper enforcement (Phase 7) ──
# Read by infrastructure/wrappers/mock-kubectl when HERMES_LAB_GOVERNANCE=L2.
# Track C uses only the kubectl subsection. The wrapper matches "${1} ${2}" prefix.
wrapper_allowlist:
  kubectl:
    - "get pods"
    - "get pod "
    - "get nodes"
    - "get endpoints"
    - "describe pod "
    - "describe node "
    - "logs "
    - "top pods"
    - "top nodes"

agent:
  max_turns: 30
  verbose: false
