# Phase 8 / TRIG-01: PrometheusRule firing on Phase 6 crashloop2 scenario
# Apply: kubectl apply -f infrastructure/scenarios/k8s/alertmanager/prometheus-rules.yaml
# Cleanup: kubectl delete -f infrastructure/scenarios/k8s/alertmanager/prometheus-rules.yaml
#
# The `release` label MUST match your Helm release name — kube-prometheus-stack configures
# Prometheus to only watch PrometheusRule resources with a matching label.
# Without it, the rule is silently ignored. (See 08-RESEARCH.md Pitfall 1.)
# The Helm release name in this course is "monitoring" (helm install monitoring ...).
# Verify with: kubectl get prometheus -n monitoring -o jsonpath='{.items[0].spec.ruleSelector}'
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hermes-lab-rules
  namespace: monitoring
  labels:
    release: monitoring
    phase: "08"
    trigger: alertmanager
spec:
  groups:
    - name: hermes-lab.k8s-crashloop
      rules:
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="k8s-trouble-crashloop"}[2m]) > 2
          for: 30s
          labels:
            severity: warning
            track: c
            trigger_source: alertmanager
          annotations:
            summary: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is crash-looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted more than 2 times in 2 minutes."
            runbook_url: "https://hermes-lab.local/runbook/k8s-crashloop"
