# Scenario 02: CrashLoopBackOff
# Failure mode: Container exits with code 1 every start; status.containerStatuses[].state.waiting.reason == "CrashLoopBackOff"
# Apply: kubectl apply -f infrastructure/scenarios/k8s/02-crashloop-backoff.yaml
# Cleanup: kubectl delete namespace k8s-trouble-crashloop
# Mock SCENARIO name: crashloop2 (NOT crashloop — that name is reserved for existing Module 10 lab)
---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-trouble-crashloop
  labels:
    scenario: k8s-trouble
    failure-mode: crashloop-backoff
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crasher
  namespace: k8s-trouble-crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crasher
  template:
    metadata:
      labels:
        app: crasher
    spec:
      containers:
      - name: crasher
        image: busybox:1.36
        command: ["sh", "-c", "echo 'starting...'; echo 'fatal: missing config'; exit 1"]
