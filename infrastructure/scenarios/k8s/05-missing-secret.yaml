# Scenario 05: Missing Secret (CreateContainerConfigError)
# Failure mode: Pod references a Secret named "app-credentials" that does not exist in the namespace
# Pod stays Pending; status.containerStatuses[].state.waiting.reason == "CreateContainerConfigError"
# Apply: kubectl apply -f infrastructure/scenarios/k8s/05-missing-secret.yaml
# Cleanup: kubectl delete namespace k8s-trouble-secret
---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-trouble-secret
  labels:
    scenario: k8s-trouble
    failure-mode: missing-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: k8s-trouble-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      volumes:
      - name: app-secret
        secret:
          secretName: app-credentials   # this Secret is intentionally NOT created
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "cat /secrets/password && sleep 3600"]
        volumeMounts:
        - name: app-secret
          mountPath: /secrets
          readOnly: true
