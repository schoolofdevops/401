# Prometheus + Grafana lab values — optimized for developer laptops
# Reduces resource requests so KIND doesn't OOM on 8GB machines
# Phase 8: AlertManager enabled for TRIG-01 (AlertManager webhook → Hermes gateway)
# AlertManager UI available at NodePort 30093

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    # Pin to control-plane so KIND extraPortMappings (hostPort: 30093) are reachable.
    # KIND only forwards hostPort traffic hitting the control-plane container.
    nodeSelector:
      ingress-ready: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  service:
    type: NodePort
    nodePort: 30093
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 12h
      receiver: hermes-webhook
    receivers:
      - name: hermes-webhook
        webhook_configs:
          - url: "http://host.docker.internal:8644/webhooks/alertmanager"
            send_resolved: false
            # send_resolved: false means AlertManager only POSTs when alerts fire,
            # not when they resolve. Flip to true in production to get paired
            # firing + resolved events.
      - name: "null"
        # Watchdog alert sink — kube-prometheus-stack injects a route for
        # alertname=Watchdog pointing to "null". This receiver silently drops it.

nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    # Allow ServiceMonitors from all namespaces (for reference-app metrics)
    serviceMonitorSelectorNilUsesHelmValues: false
  service:
    type: NodePort
    nodePort: 30091

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    type: NodePort
    nodePort: 30090
  # Default admin credentials for lab use (not production)
  adminPassword: admin
  adminUser: admin
