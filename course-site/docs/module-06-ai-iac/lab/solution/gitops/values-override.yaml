# Override to demonstrate GitOps sync
# Change api-gateway replicas to 2 — push this to your fork and watch ArgoCD sync
#
# Usage:
#   1. Copy this content into reference-app/helm/reference-app/values.yaml
#      (change apiGateway.replicaCount from 1 to 2)
#   2. git add + git commit + git push
#   3. Watch: kubectl get applications -n argocd (syncs within 3 minutes)
#   4. Verify: kubectl get pods -n app (should show 2 api-gateway pods)
apiGateway:
  replicaCount: 2
