# Module 8 solution — Track A reference implementation
# Track A: Database Health & Tuning Agent
# Governance Level: L2 Advisory
# Install:
#   hermes profile create track-a
#   cp agents/track-a-database/config.yaml ~/.hermes/profiles/track-a/
#   cp agents/track-a-database/SOUL.md ~/.hermes/profiles/track-a/
#   cp -r agents/track-a-database/skills/dba-rds-slow-query ~/.hermes/profiles/track-a/skills/
# Launch:  hermes -p track-a chat

model:
  default: "anthropic/claude-haiku-4"
  provider: "auto"

platform_toolsets:
  cli: [terminal, file, web, skills]

approvals:
  mode: manual       # L2: all flagged dangerous commands require human approval
  timeout: 300       # 5 min — required for lab flows with multiple approval steps

command_allowlist: []  # L2: nothing pre-approved; L4 would add "SELECT", "EXPLAIN", "SHOW"

agent:
  max_turns: 30
  verbose: false
