# Module 8 Lab — config.yaml starter
# This file goes at: ~/.hermes/profiles/<your-track>/config.yaml
# Fill in every TODO. See course/agents/track-a-database/config.yaml for a completed example.

model:
  # TODO: Set the default model. For labs, use "anthropic/claude-haiku-4" (lowest cost).
  # Other options: "google/gemini-2.5-flash" (Google AI Studio free tier)
  default: "anthropic/claude-haiku-4"
  provider: "auto"

platform_toolsets:
  # TODO: Choose which toolsets your agent has access to.
  # [terminal, file, web, skills] = L2 Advisory (can run commands + read files + browse + load skills)
  # [web, skills] = L1 Assistive (read-only, cannot run commands)
  cli: [terminal, file, web, skills]

approvals:
  # TODO: Set the approval mode.
  # manual = every dangerous command requires your explicit approval (L2 Advisory)
  # smart  = auxiliary LLM reviews flagged commands, auto-approves low-risk (L3 Proposal)
  # off    = no approval prompts (NOT recommended for lab work)
  mode: manual

  # TODO: Set approval timeout in seconds.
  # Default is 60. For lab flows with multiple approval steps, use 300.
  timeout: 300

# TODO: command_allowlist — list of pre-approved dangerous command patterns.
# L1-L3: leave empty. L4: add description-key strings from tools/approval.py DANGEROUS_PATTERNS.
command_allowlist: []

agent:
  # TODO: Set max_turns. 30 is sufficient for lab scenarios.
  max_turns: 30
  verbose: false
