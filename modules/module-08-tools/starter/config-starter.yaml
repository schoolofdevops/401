# Module 8 Lab — config.yaml starter
# This file goes at: ~/.hermes/profiles/<your-track>/config.yaml
# Fill in every TODO. See course/agents/track-a-database/config.yaml for a completed example.

# ── Provider Configuration ──
# Two supported options. Uncomment ONE of the two "model:" blocks below.
#
# Option A (default, zero setup if you already have ANTHROPIC_API_KEY or a Claude subscription):
#   Anthropic Claude Haiku 4 — lowest-cost paid Anthropic model, works with your existing key.
#
# Option B (free tier, recommended if you don't have an Anthropic key):
#   Gemini 2.5 Flash via Google AI Studio — 500 req/day free, no credit card.
#   REQUIRES: an API key from https://aistudio.google.com stored in the profile's .env file:
#     echo 'OPENAI_API_KEY=<your-gemini-api-key>' > ~/.hermes/profiles/<your-track>/.env
#   The OPENAI_API_KEY name is intentional — Google AI Studio exposes an OpenAI-compatible
#   endpoint, so Hermes reads the key from the OPENAI_API_KEY env var even though it's a
#   Gemini key. See course/setup/llm-access.md for the API key creation walkthrough.

# Option A — Anthropic (uncomment to use)
model:
  default: "anthropic/claude-haiku-4"
  provider: "auto"

# Option B — Google Gemini (uncomment to use; comment out Option A above)
# model:
#   default: "gemini-2.5-flash"
#   provider: "custom:google-ai-studio"
#
# custom_providers:
#   - name: google-ai-studio
#     base_url: https://generativelanguage.googleapis.com/v1beta/openai

platform_toolsets:
  # TODO: Choose which toolsets your agent has access to.
  # [terminal, file, web, skills] = L2 Advisory (can run commands + read files + browse + load skills)
  # [web, skills] = L1 Assistive (read-only, cannot run commands)
  cli: [terminal, file, web, skills]

approvals:
  # TODO: Set the approval mode.
  # manual = every dangerous command requires your explicit approval (L2 Advisory)
  # smart  = auxiliary LLM reviews flagged commands, auto-approves low-risk (L3 Proposal)
  # off    = no approval prompts (NOT recommended for lab work)
  mode: manual

  # TODO: Set approval timeout in seconds.
  # Default is 60. For lab flows with multiple approval steps, use 300.
  timeout: 300

# TODO: command_allowlist — list of pre-approved dangerous command patterns.
# L1-L3: leave empty. L4: add description-key strings from tools/approval.py DANGEROUS_PATTERNS.
command_allowlist: []

agent:
  # TODO: Set max_turns. 30 is sufficient for lab scenarios.
  max_turns: 30
  verbose: false
